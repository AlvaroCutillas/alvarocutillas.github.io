<svg role="img" aria-labelledby="hedge-title hedge-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="720pt" height="288pt" viewBox="0 0 720 288" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="hedge-title">Figure 18 · Surface-aware spot sensitivities</title><desc id="hedge-desc">One-year strike 100; rate 3%, yield 1%. Sticky strike holds this option IV constant; sticky log-moneyness keeps sigma(k,T) fixed while the forward changes with spot. Numerical gradients use a 0.15 spot grid; endpoints are one-sided.</desc>
