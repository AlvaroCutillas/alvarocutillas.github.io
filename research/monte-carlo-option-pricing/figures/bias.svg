<svg role="img" aria-labelledby="bias-title bias-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="252pt" viewBox="0 0 662.4 252" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="bias-title">Figure 05 · Euler discretisation bias and paired statistical uncertainty</title><desc id="bias-desc">100,000 coupled paths; seed 1006. Euler and exact terminals share the same total Brownian increment. Shading is a pointwise 95% normal interval for their expected payoff difference. More samples estimate this bias more precisely; they do not remove it.</desc>
