<svg role="img" aria-labelledby="lsm-title lsm-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="252pt" viewBox="0 0 662.4 252" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="lsm-title">Figure 16 · Least-squares exercise policies and independent evaluation</title><desc id="lsm-desc">25,000 training paths (seed 1012), 50,000 independent test paths (seed 1013), 50 exercise dates. Shading measures test-sample uncertainty conditional on the trained policy. The CRR comparison permits more exercise dates; a confidence interval for a suboptimal policy does not cover its policy bias.</desc>
