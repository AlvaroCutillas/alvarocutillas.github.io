<svg role="img" aria-labelledby="barrier-title barrier-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="252pt" viewBox="0 0 662.4 252" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="barrier-title">Figure 14 · Missed barrier crossings and conditional survival weights</title><desc id="barrier-desc">Up-and-out call, K = 100, upper barrier 130, no rebate; seed 1009, 60,000 coupled paths. Node-only prices refer to different discrete monitoring contracts. Bridge weights target the continuously monitored GBM contract; the reference is one-dimensional numerical integration of the exact terminal conditional survival payoff.</desc>
