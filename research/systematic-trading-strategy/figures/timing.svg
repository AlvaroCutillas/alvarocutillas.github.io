<svg role="img" aria-labelledby="timing-title timing-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="720pt" height="288pt" viewBox="0 0 720 288" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="timing-title">Figure 01 · The effect of a look-ahead selector</title><desc id="timing-desc">Five simple returns: +10%, −10%, +8%, −6%, +4%; zero cash return and no costs. The illegal rule selects exposure using the return it then claims to earn. The past-return rule is only a simplified timing example, not the laboratory execution convention.</desc>
