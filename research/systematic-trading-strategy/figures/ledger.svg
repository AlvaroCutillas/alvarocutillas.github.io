<svg role="img" aria-labelledby="ledger-title ledger-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="720pt" height="288pt" viewBox="0 0 720 288" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="ledger-title">Figure 09 · Position and cash accounting</title><desc id="ledger-desc">Initial wealth 100; toy prices 100, 110, 99, 103.95, 98.7525. Formation targets alternate long/cash; one-session execution delay, 10 bps one-way cost, zero cash return. The first formation-day signal enters at the following close.</desc>
