<svg role="img" aria-labelledby="sharpe-title sharpe-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="720pt" height="288pt" viewBox="0 0 720 288" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="sharpe-title">Figure 14 · Sharpe scaling under serial dependence</title><desc id="sharpe-desc">Stationary additive differential returns with autocorrelation ρᵏ and finite variance. The multiplier is √q divided by √(1 + 2Σ(1−k/q)ρᵏ). It concerns aggregated additive returns, not exact compounding of a trading account.</desc>
