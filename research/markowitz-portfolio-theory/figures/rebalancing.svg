<svg role="img" aria-labelledby="rebalancing-title rebalancing-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="252pt" viewBox="0 0 662.4 252" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="rebalancing-title">Figure 16 · Fixed initial weights are not a complete trading policy</title><desc id="rebalancing-desc">Synthetic monthly simple returns with mean μ/12 and covariance Σ/12, seed 3003; starting weights 50%, 30%, 20%. Annualisation is an IID moment approximation; these monthly inputs do not imply exact compounded annual simple-return moments. No costs, no external flows, and no claim of one policy’s general superiority.</desc>
