<svg role="img" aria-labelledby="frontier-title frontier-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="259.2pt" viewBox="0 0 662.4 259.2" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="frontier-title">Figure 06 · The minimum-variance boundary has two branches</title><desc id="frontier-desc">Benchmark inputs, unrestricted short selling and net weights summing to one. Only the branch at or above the global minimum-variance return is efficient for increasing mean and decreasing variance. The lower branch is dominated at the same volatility.</desc>
