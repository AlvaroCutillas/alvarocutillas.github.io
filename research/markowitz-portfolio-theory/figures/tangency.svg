<svg role="img" aria-labelledby="tangency-title tangency-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="252pt" viewBox="0 0 662.4 252" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="tangency-title">Figure 09 · Tangency weights depend on the risk-free rate</title><desc id="tangency-desc">All plotted rates are below the benchmark global minimum-variance return, so the conventional positive-budget tangency is well defined. Holding the risky mean vector fixed while changing financing is a comparative-static model experiment.</desc>
