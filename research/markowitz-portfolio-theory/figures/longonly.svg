<svg role="img" aria-labelledby="longonly-title longonly-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="259.2pt" viewBox="0 0 662.4 259.2" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="longonly-title">Figure 11 · Short-sale constraints change the feasible frontier</title><desc id="longonly-desc">Same population moments for both curves. Long-only returns cannot exceed the highest constituent mean, 14%, or fall below 6%. A constrained portfolio may perform better with estimated inputs, but it cannot beat the unrestricted optimum under identical known inputs and target.</desc>
