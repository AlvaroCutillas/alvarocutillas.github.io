<svg role="img" aria-labelledby="weights-title weights-desc" xmlns:xlink="http://www.w3.org/1999/xlink" width="662.4pt" height="259.2pt" viewBox="0 0 662.4 259.2" xmlns="http://www.w3.org/2000/svg" version="1.1"><title id="weights-title">Figure 07 · Unrestricted frontier weights are affine in target return</title><desc id="weights-desc">Benchmark inputs and no leverage bound. The net budget stays at one while gross exposure can exceed one. The ability to extrapolate the frontier is mathematical permission to take long and short positions, not an executable financing assumption.</desc>
